name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and later removed is still
          # in the history, and still leaked.
          fetch-depth: 0

      # We call the gitleaks CLI directly instead of gitleaks/gitleaks-action@v2.
      # That action requires a paid GITLEAKS_LICENSE for ORGANIZATION-owned repos
      # and fails within seconds without one. This repo is org-owned, so it would
      # never have worked. The CLI is the same scanner under the MIT licence with
      # no such gate.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan history for secrets
        run: ./gitleaks detect --source . --redact --no-banner --exit-code 1
